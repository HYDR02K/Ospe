<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab Practical — Anatomy B4</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#f2ede1;
    --paper-dark:#e8e0cf;
    --ink:#2b2620;
    --ink-soft:#6b6252;
    --accent:#8a1f2b;      /* specimen-label crimson */
    --accent-soft:#c98a90;
    --line:#cdc2a8;
    --panel:#fffdf7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    display:flex;
    min-height:100vh;
  }
  /* Sidebar: page index, like a specimen ledger */
  #sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--paper-dark);
    border-right:1px solid var(--line);
    padding:22px 0;
    overflow-y:auto;
    height:100vh;
    position:sticky;
    top:0;
  }
  #sidebar h1{
    font-size:15px;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin:0 20px 4px;
    color:var(--accent);
    font-family:'Courier New',monospace;
  }
  #sidebar .sub{
    margin:0 20px 20px;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Courier New',monospace;
    letter-spacing:.05em;
  }
  #page-list{list-style:none;margin:0;padding:0;}
  #page-list li{
    padding:9px 20px;
    font-family:'Courier New',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border-left:3px solid transparent;
    letter-spacing:.03em;
    transition:background .15s;
  }
  #page-list li:hover{background:rgba(138,31,43,0.06);}
  #page-list li.active{
    color:var(--ink);
    border-left-color:var(--accent);
    background:rgba(138,31,43,0.09);
    font-weight:bold;
  }

  /* Main viewer */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:34px 24px 60px;
  }
  #toolbar{
    width:100%;
    max-width:900px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  #toolbar .label{
    font-family:'Courier New',monospace;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  #toolbar .nav-btns button{
    font-family:'Courier New',monospace;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 16px;
    font-size:13px;
    cursor:pointer;
    letter-spacing:.05em;
  }
  #toolbar .nav-btns button:hover{border-color:var(--accent);color:var(--accent);}
  #toolbar .nav-btns button:disabled{opacity:.35;cursor:default;}
  #toolbar .nav-btns{display:flex;gap:8px;}

  #frame{
    max-width:900px;
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    box-shadow:0 4px 18px rgba(43,38,32,0.12);
    padding:14px;
    position:relative;
  }
  #frame::before{
    content:"SPECIMEN " attr(data-num);
    position:absolute;
    top:-11px;
    left:20px;
    background:var(--accent);
    color:#fff;
    font-family:'Courier New',monospace;
    font-size:10px;
    letter-spacing:.12em;
    padding:3px 10px;
  }
  #page-img{
    width:100%;
    display:block;
  }
  #counter{
    margin-top:16px;
    font-family:'Courier New',monospace;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);}
  ::-webkit-scrollbar-track{background:var(--paper-dark);}

  @media (max-width:700px){
    body{flex-direction:column;}
    #sidebar{
      width:100%;
      height:auto;
      position:relative;
      max-height:180px;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    #main{padding:20px 12px 40px;}
  }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Anatomy · B4</h1>
  <div class="sub">Lab Practical — 30 pages</div>
  <ul id="page-list"></ul>
</div>

<div id="main">
  <div id="toolbar">
    <span class="label" id="toolbar-label">Page 1 of 30</span>
    <div class="nav-btns">
      <button id="prev-btn">&larr; Prev</button>
      <button id="next-btn">Next &rarr;</button>
    </div>
  </div>

  <div id="frame" data-num="01">
    <img id="page-img" src="anatomy_pages/page-01.jpg" alt="Page 1">
  </div>
  <div id="counter">1 / 30</div>
</div>

<script>
  const TOTAL = 30;
  let current = 1;

  const list = document.getElementById('page-list');
  for(let i=1;i<=TOTAL;i++){
    const li = document.createElement('li');
    const n = String(i).padStart(2,'0');
    li.textContent = 'Page ' + n;
    li.dataset.page = i;
    li.addEventListener('click', ()=>goTo(i));
    list.appendChild(li);
  }

  const img = document.getElementById('page-img');
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const toolbarLabel = document.getElementById('toolbar-label');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  function goTo(n){
    if(n < 1 || n > TOTAL) return;
    current = n;
    const padded = String(n).padStart(2,'0');
    img.src = 'anatomy_pages/page-' + padded + '.jpg';
    img.alt = 'Page ' + n;
    frame.dataset.num = padded;
    counter.textContent = n + ' / ' + TOTAL;
    toolbarLabel.textContent = 'Page ' + n + ' of ' + TOTAL;
    prevBtn.disabled = n === 1;
    nextBtn.disabled = n === TOTAL;
    [...list.children].forEach(li=>{
      li.classList.toggle('active', Number(li.dataset.page) === n);
    });
    const activeLi = list.children[n-1];
    if(activeLi) activeLi.scrollIntoView({block:'nearest'});
  }

  prevBtn.addEventListener('click', ()=>goTo(current-1));
  nextBtn.addEventListener('click', ()=>goTo(current+1));
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight') goTo(current+1);
    if(e.key === 'ArrowLeft') goTo(current-1);
  });

  goTo(1);
</script>

</body>
</html>
